name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'armonik-client/**'
      - 'worker/**'
      - 'integration-tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: [armonik-client, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Show tool versions
        working-directory: ${{ matrix.module }}
        run: |
          java -version
          ./mvnw -v

      - name: Verify ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: ./mvnw -B -ntp verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.module }} surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-surefire-reports
          path: ${{ matrix.module }}/**/target/surefire-reports/**

      - name: Upload ${{ matrix.module }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-artifacts
          path: |
            ${{ matrix.module }}/target/*.jar
            ${{ matrix.module }}/target/*.pom

  end2end:
    name: End-to-end (tls ${{ matrix.tls }}, mtls ${{ matrix.mtls }})
    runs-on: ubuntu-latest
    needs: build-modules

    strategy:
      fail-fast: false
      matrix:
        include:
          - { tls: false, mtls: false }
          - { tls: true, mtls: false }
          - { tls: true, mtls: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install ArmoniK dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@main
        with:
          docker: true
          terraform: true
          k3s: true

      - name: Checkout ArmoniK
        uses: actions/checkout@v4
        with:
          repository: aneoconsulting/ArmoniK
          path: infra

      # Installs armonik-worker-domain, which the test processors depend on. The docker profile pushes
      # the image during package, so the image is built at compile, exploded, into the local daemon.
      - name: Build the dynamic Java worker image
        working-directory: worker
        run: |
          ./mvnw -B -ntp install -DskipTests
          ./mvnw -B -ntp -pl armonik-worker -Pdocker compile jib:dockerBuild -Djib.containerizingMode=exploded \
            -Djib.to.image=dockerhubaneo/armonik-dynamic-java-worker:ci -Djib.from.platforms=linux/amd64
          docker save dockerhubaneo/armonik-dynamic-java-worker:ci | sudo k3s ctr images import /dev/stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install armonik-client
        working-directory: armonik-client
        run: ./mvnw -B -ntp install -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Java worker talks to its agent over TCP only
      - id: deploy
        name: Deploy ArmoniK
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          tls: ${{ matrix.tls }}
          mtls: ${{ matrix.mtls }}
          generate-client-cert: ${{ matrix.mtls }}
          override-compute: true
          override-worker-image: dockerhubaneo/armonik-dynamic-java-worker
          override-worker-version: ci
          override-worker-partition: javadynamic
          override-worker-socket: tcp
          log-suffix: java-${{ matrix.tls }}-${{ matrix.mtls }}

      - name: Point armonik.local at the ingress
        if: ${{ matrix.tls }}
        run: echo -e "$(kubectl get svc nginx -n armonik -o jsonpath={.status.loadBalancer.ingress[0].ip})\tarmonik.local" | sudo tee -a /etc/hosts

      - name: Run the integration tests
        timeout-minutes: 20
        run: |
          set -e
          generated="${{ steps.deploy.outputs.generated-folder }}"
          export ARMONIK_IT_ENDPOINT=$(jq -r .armonik.control_plane_url "$generated/armonik-output.json")
          export ARMONIK_IT_PARTITION=javadynamic
          if [ "${{ matrix.tls }}" = "true" ]; then
            export ARMONIK_IT_CA_CERT="$generated/certificates/ingress/ca.crt"
          fi
          if [ "${{ matrix.mtls }}" = "true" ]; then
            export ARMONIK_IT_CLIENT_P12="$generated/certificates/ingress/client.submitter.p12"
          fi
          cd armonik-client
          ./mvnw -B -ntp -f ../integration-tests/pom.xml verify -Darmonik.it.label=ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-tls-${{ matrix.tls }}-mtls-${{ matrix.mtls }}
          path: |
            integration-tests/client-it/target/failsafe-reports/**
            integration-tests/client-it/target/it-metrics-*.tsv
